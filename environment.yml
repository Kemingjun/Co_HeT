name: my310env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch
  - torchvision
  - pytorch-cuda=12.1
  - numpy
  - pandas
  - scipy
  - matplotlib
  - tqdm
  - openpyxl
  - tensorboard
  - pip
  - pip:
      - tensorboard_logger
